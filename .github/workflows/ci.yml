name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        # Narrow rule set, configured in pyproject.toml -- mistakes, not style.
        run: python -m ruff check src tests

      - name: Run the suite
        # pyproject sets pythonpath = ["src"], so this needs no PYTHONPATH.
        run: python -m pytest -q

  docker:
    name: docker image builds and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t hydration:ci .

      - name: Start it
        run: |
          docker run -d --name hydration-ci -p 8080:8080 \
            -e HYDRATION_SYNC_ENABLED=0 \
            hydration:ci

      - name: Wait for the healthcheck to pass
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "never became healthy"; docker logs hydration-ci; exit 1

      - name: The API refuses an anonymous caller
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/status)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }

      - name: The CLI works inside the image
        run: docker exec hydration-ci hydration --help

      - name: A backup can be taken and put back
        # The restore path is the half that matters, and the half nobody
        # exercises until the day they need it.
        run: |
          docker exec hydration-ci hydration backup --into /tmp/b
          file=$(docker exec hydration-ci sh -c 'ls /tmp/b/hydration-*.db | head -1')
          docker exec hydration-ci hydration restore --force "$file"

      - name: Logs
        if: always()
        run: docker logs hydration-ci
